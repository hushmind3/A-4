name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew :client:assembleDebug :client:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dominion-mobile-debug
          path: client/build/outputs/apk/debug/client-debug.apk

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and start Android 35 virtual device
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name dominion-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" -avd dominion-test -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 4; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Execute Android instrumentation tests
        run: |
          chmod +x gradlew
          ./gradlew :client:connectedDebugAndroidTest --no-daemon
      - name: Collect emulator results
        if: always()
        run: |
          adb logcat -d > "$RUNNER_TEMP/android-logcat.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-emulator-results
          path: |
            client/build/outputs/androidTest-results/
            client/build/reports/androidTests/
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/android-logcat.txt
