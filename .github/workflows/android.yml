name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew :client:assembleDebug :client:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dominion-mobile-debug
          path: client/build/outputs/apk/debug/client-debug.apk

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: android-emulator-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Run Android 35 instrumentation on emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          script: chmod +x gradlew && ./gradlew :client:connectedDebugAndroidTest --no-daemon
      - name: Collect bounded diagnostics
        if: always()
        run: timeout 20 adb logcat -d > "$RUNNER_TEMP/android-logcat.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-emulator-results
          path: |
            client/build/outputs/androidTest-results/
            client/build/reports/androidTests/
            ${{ runner.temp }}/android-logcat.txt
